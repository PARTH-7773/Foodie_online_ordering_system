<script>

    const edit_container = document.querySelector(".edit-container");
    const productDetails = document.querySelector("#product-details");
    const leftCol = document.querySelector('.left-col')
    const rigthCol = document.querySelector('.right-col')
    const error = document.querySelector(".error")
    const update_btn = document.querySelector("#update-btn");

    const URLParam = new URLSearchParams(window.location.search);
    const productID = URLParam.get('id');

    const cats = ['Burger', 'Pizza', 'Chicken', 'Chinese', 'Indian', 'Drinks', 'Dessert'];

    try {

        const getProductDetails = async (productID) => {

            response = await fetch(`http://localhost:7773/api/product/get-product/${productID}`)
            const result = await response.json();

            if (result.success && result.data !== null) {
                showProductDetails(result.data);
            }
            else {
                update_btn.classList.add("button")
                let error = document.createElement('div')
                error.classList.add("msg", "error");
                error.innerHTML = `<i class='fas fa-exclamation-circle'></i> ${result.message}`
                edit_container.appendChild(error)
            }

        }

        getProductDetails(productID)
    } catch (err) {
        update_btn.classList.add("button")
        let error = document.createElement('div')
        error.classList.add("msg", "error");
        error.innerHTML = `<i class='fas fa-exclamation-circle'>${result.message}</i>`
        edit_container.appendChild(error)
    }

    function showProductDetails(product) {
        // console.log(product);
        leftCol.innerHTML = `
                        <div class="input-group">
                            <label>Product Name</label>
                            <input type="text" name="name" value="${product.name}" required>
                        </div>

                        <div class="input-group" style="margin-top: 1.5rem;">
                            <label>Price (₹)</label>
                            <input type="number" step="0.01" name="price" value="${product.price}" required>
                        </div>`;

        const div = document.createElement("div");
        div.classList.add("input-group");
        div.id = 'category';
        div.style.marginTop = "1.5rem";
        div.innerHTML = `<label>Category</label>
                        <select class='select-pro' name="category ">
                            ${(
                cats.map((c, idx) => {
                    let selected = (product.category === c) ? 'selected' : ''
                    // console.log(selected);
                    return `<option value='${c}' ${selected}>${c}</option>`
                })
            )}    
                        </select>`;
        leftCol.appendChild(div)

        rigthCol.innerHTML = `
                        <div class="input-group">
                            <label>Product Image</label>
                            <div class="image-preview-box">
                                <p style="font-size: 0.9rem; color: gray; margin-bottom: 10px;">Current Image</p>
                                <img src="../${product.image}" class="current-img">
                                
                                <input type="file" name="image" style="padding: .6rem; font-size: 1rem;">
                                <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">Upload new to replace</p>
                            </div>
                        </div>
                    `;
    }


      productDetails.addEventListener("submit", (e)=>{
        e.preventDefault();

        const formData = new FormData(productDetails)
        // console.log(formData);
        // const name = formData.get('name');
        // console.log(name);

        const {name , price , category , image } = Object.fromEntries(formData);
